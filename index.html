<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pines de Rebeca Marroquín: diseña e imprime plantillas de pines en hoja A4." />
    <meta name="theme-color" content="#4285F4" />
    <link rel="icon" type="image/svg+xml" href="./pin.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Pines de Rebeca Marroquín</title>
  </head>
  <body>
    <header class="app-header">
      <div class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="brand">
        <h1>Pines de Rebeca Marroquín</h1>
        <p class="tagline">✦ Estudio <b>anime &amp; kawaii</b> · diseñado para brillar ✦</p>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-pill" id="hdr-undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
        <button type="button" class="icon-pill" id="hdr-redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
        <button type="button" class="icon-pill" id="hdr-help" title="Ayuda" aria-label="Ayuda">?</button>
        <img class="avatar-pin" src="./avatar-rebeca.svg" alt="Avatar de Rebeca (provisional)" width="48" height="48" />
      </div>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
